<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0f" />
    <title>紫微卜运 - AI 命理工具</title>

    <!-- 关键资源预加载 -->
    <link rel="preload" as="image" href="/bg-ziwei.webp" type="image/webp">

    <!-- DNS 预解析 + 预连接（减少微信环境下的网络延迟） -->
    <link rel="preconnect" href="https://fonts.loli.net">
    <link rel="preconnect" href="https://gstatic.loli.net" crossorigin>
    <link rel="dns-prefetch" href="https://ziweiapi.zeabur.app">

    <!-- 国内字体镜像: 精简字重版本（减少8-12个Unicode分片请求） -->
    <!-- Noto Sans SC: 5个字重 → 3个字重 (400,500,600) -->
    <!-- Noto Serif SC: 4个字重 → 2个字重 (500,600) -->
    <!-- Ma Shan Zheng: 保持不变（书法字体通常只有1个字重） -->
    <link href="https://fonts.loli.net/css2?family=Ma+Shan+Zheng&family=Noto+Sans+SC:wght@400;500;600&family=Noto+Serif+SC:wght@500;600&display=swap" rel="stylesheet">

    <!-- 内联关键CSS：避免FOIT（不可见文本闪烁），提升首屏渲染速度 -->
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", sans-serif;
        background-color: #111028;
      }
      #root { min-height: 100vh; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
