<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- 强制防缓存：针对 iOS 微信顽固缓存 -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate, max-age=0" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="apple-mobile-web-app-capable" content="no" />
    <link rel="icon" type="image/png" href="/favicon.png?v=20260601b" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0f" />
    <title>紫微卜运 - AI 命理工具</title>

    <!-- 关键资源预加载 -->
    <link rel="preload" as="image" href="/bg-ziwei.webp" type="image/webp">

    <!-- DNS 预解析 + 预连接（减少微信环境下的网络延迟） -->
    <link rel="preconnect" href="https://fonts.loli.net">
    <link rel="preconnect" href="https://gstatic.loli.net" crossorigin>
    <link rel="dns-prefetch" href="https://ziweiapi.zeabur.app">

    <!-- 关键字体预加载（高优先级） -->
    <link rel="preload" as="style" href="https://fonts.loli.net/css2?family=Ma+Shan+Zheng&family=Noto+Sans+SC:wght@400;500;600&family=Noto+Serif+SC:wght@500;600&display=swap">

    <!-- 国内字体镜像: 精简字重版本（减少8-12个Unicode分片请求） -->
    <!-- Noto Sans SC: 5个字重 → 3个字重 (400,500,600) -->
    <!-- Noto Serif SC: 4个字重 → 2个字重 (500,600) -->
    <!-- Ma Shan Zheng: 保持不变（书法字体通常只有1个字重） -->
    <link href="https://fonts.loli.net/css2?family=Ma+Shan+Zheng&family=Noto+Sans+SC:wght@400;500;600&family=Noto+Serif+SC:wght@500;600&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript><link href="https://fonts.loli.net/css2?family=Ma+Shan+Zheng&family=Noto+Sans+SC:wght@400;500;600&family=Noto+Serif+SC:wght@500;600&display=swap" rel="stylesheet"></noscript>

    <!-- 内联关键CSS：避免FOIT（不可见文本闪烁），提升首屏渲染速度 -->
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", sans-serif;
        background-color: #111028;
        background-image: url('/bg-ziwei-mobile.webp');
        background-size: cover;
        background-position: center center;
        background-attachment: fixed;
        background-repeat: no-repeat;
      }
      @media (min-width: 768px) {
        body {
          background-image: url('/bg-ziwei.webp');
        }
      }
      #root { min-height: 100vh; }
      
      /* 字体加载期间使用系统字体，避免布局偏移 */
      .font-brush, [style*="font-brush"] {
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <!--
      ============================================
      iOS 微信缓存强制清除脚本
      解决 iPhone 设备显示旧版本问题
      ============================================
    -->
    <script>
      (function() {
        // 当前部署版本号（每次更新代码时修改此值）
        var CURRENT_VERSION = '20260601-2'

        // 从 localStorage 获取上次访问的版本
        var lastVersion = localStorage.getItem('app_version') || ''

        // 如果版本不匹配，强制清除所有缓存并刷新
        if (lastVersion !== CURRENT_VERSION) {
          console.log('[Cache] 版本更新: ' + lastVersion + ' -> ' + CURRENT_VERSION + ', 正在清除缓存...')

          // 清除 localStorage 中的缓存数据（保留用户登录态）
          var keysToKeep = ['token', 'user_info', 'auth_token']
          var allKeys = []
          try {
            for (var i = 0; i < localStorage.length; i++) {
              allKeys.push(localStorage.key(i))
            }
          } catch(e) {}

          allKeys.forEach(function(key) {
            if (keysToKeep.indexOf(key) === -1) {
              try { localStorage.removeItem(key) } catch(e) {}
            }
          })

          // 清除 sessionStorage
          try { sessionStorage.clear() } catch(e) {}

          // 尝试清除 Cache Storage (Service Worker 缓存)
          if ('caches' in window) {
            caches.keys().then(function(names) {
              names.forEach(function(name) {
                caches.delete(name)
              })
            }).catch(function(){})
          }

          // 保存新版本号
          try { localStorage.setItem('app_version', CURRENT_VERSION) } catch(e) {}

          // 强制重新加载页面（带时间戳参数破坏缓存）
          var ts = Date.now()
          var newUrl = window.location.pathname + '?_v=' + CURRENT_VERSION + '&_t=' + ts +
            (window.location.hash ? window.location.hash : '')

          // 使用 replace 避免浏览器历史记录堆积
          window.location.replace(newUrl)
        }
      })()
    </script>

    <!-- 入口文件：添加版本号参数破坏缓存 -->
    <script type="module" src="/src/main.tsx?v=20260601-2"></script>
  </body>
</html>
